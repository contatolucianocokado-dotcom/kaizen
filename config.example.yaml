app:
  name: "Kaizen"
  base_url: "https://seu-dominio.com"
  timezone: "America/Sao_Paulo"
  api_token: "${KAIZEN_API_TOKEN}"
  database_path: "roas_cache.sqlite3"

google_ads:
  developer_token: "${GOOGLE_ADS_DEVELOPER_TOKEN}"
  client_id: "${GOOGLE_OAUTH_CLIENT_ID}"
  client_secret: "${GOOGLE_OAUTH_CLIENT_SECRET}"
  refresh_token: "${GOOGLE_OAUTH_REFRESH_TOKEN}"
  login_customer_id: "SEU_MCC_ID"
  api_version: "v23"
  fetch_all_accounts: true
  customers:
    - customer_id: "SEU_CUSTOMER_ID"
      name: "exemplo.com | PAIS"
      site: "exemplo.com"

gam:
  client_id: "${GOOGLE_OAUTH_CLIENT_ID}"
  client_secret: "${GOOGLE_OAUTH_CLIENT_SECRET}"
  refresh_token: "${GOOGLE_OAUTH_REFRESH_TOKEN}"
  application_name: "Kaizen"
  networks:
    - network_code: "SEU_NETWORK_CODE"
      name: "Exemplo GAM"
      site: "exemplo.com"
      currency: "BRL"

projects:
  - site: "exemplo.com"
    google_ads_customer_id: "SEU_CUSTOMER_ID"
    gam_network_code: "SEU_NETWORK_CODE"

site_mapping:
  exemplo.com: exemplo.com

dashboard_projects:
  - exemplo.com

agents:
  enabled: true
  timezone: "America/Sao_Paulo"
  telegram_enabled: false

rules:
  floor_automation_enabled: false
  never_rewrite_utm: true
  require_test_after_implementation: true

setup_inicial:
  enabled: true
  oauth_required_scopes:
    - "https://www.googleapis.com/auth/adwords"
    - "https://www.googleapis.com/auth/admanager"
    - "https://www.googleapis.com/auth/analytics.edit"
    - "https://www.googleapis.com/auth/tagmanager.manage.accounts"
    - "https://www.googleapis.com/auth/tagmanager.edit.containers"
    - "https://www.googleapis.com/auth/tagmanager.edit.containerversions"
    - "https://www.googleapis.com/auth/tagmanager.publish"
  google_ads_mcc_only: true
  hide_oauth_button_when_valid: true
  require_manual_ads_terms_check: false
  require_manual_gtm_preview_check: false
  clarity:
    project_id: "${CLARITY_PROJECT_ID}"
    data_export_api_token: "${CLARITY_DATA_EXPORT_TOKEN}"
    mask_token_in_ui: true

campaign_builder:
  enabled: true
  require_destination_url_analysis: true
  allow_model_account: true
  allow_no_model: true
  supported_types:
    - SEARCH
    - DEMAND_GEN
    - PERFORMANCE_MAX

sync:
  recent_ads_source: "google_ads_script"
  recent_gam_job: "sync_gam_today_fast.py"
  full_sync_schedule: "daily"
  prevent_overlap: true
  fast_timeout_seconds: 480

placements:
  demand_gen_exclusions_enabled: false
  require_human_approval: true

telegram:
  enabled: false
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
